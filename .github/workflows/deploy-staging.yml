name: Deploy

# CLAUDE.md section 60's deployment pipeline:
#   main -> build -> test -> deploy staging -> smoke tests -> production
#
# `build-and-test` and `assert-live-trading-disabled` below are REAL,
# working jobs -- they run on every push to main. Everything past them
# (`deploy-staging`, `smoke-tests-staging`, `deploy-production`) is a
# documented SKELETON: this repo has no AWS/Vercel/registry credentials
# configured (no such secrets exist in this repo), so those jobs are
# guarded with `if: false` and contain commented-out placeholder steps
# rather than commands that would fail on every merge to main. Wiring them
# up for real means, at minimum:
#   1. Deciding on real infra (see infra/terraform/README.md -- this
#      repo deliberately does not invent Terraform against a
#      nonexistent AWS account).
#   2. Adding the resulting deploy credentials as repository/environment
#      secrets (e.g. AWS_ROLE_ARN for OIDC, VERCEL_TOKEN, a container
#      registry token).
#   3. Flipping each `if: false` below to a real condition (e.g.
#      `if: github.ref == 'refs/heads/main'`) once step 2 is done.
#   4. Filling in the placeholder `run:` blocks with real deploy commands.
#
# CLAUDE.md section 60 / 61: live trading must never automatically enable
# merely because production deployed. `assert-live-trading-disabled` makes
# that assertion an enforced CI step (over .env.example, the template every
# real environment's config is derived from), not just a comment.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a deploy mid-flight

env:
  PNPM_VERSION: "9.12.0"
  NODE_VERSION: "20"

jobs:
  # -------------------------------------------------------------------
  # REAL: build + test (same as ci.yml's build-test job)
  # -------------------------------------------------------------------
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build

  # -------------------------------------------------------------------
  # REAL: staging must never come up with live trading enabled.
  # -------------------------------------------------------------------
  assert-live-trading-disabled:
    name: Assert ENABLE_LIVE_TRADING=false stays the default
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check .env.example
        run: |
          if ! grep -qx 'ENABLE_LIVE_TRADING=false' .env.example; then
            echo "::error::.env.example must default ENABLE_LIVE_TRADING=false (CLAUDE.md sections 22, 61, 96). Live trading must require explicit, deliberate opt-in outside of this template -- it must never become the shipped default." >&2
            exit 1
          fi
          echo "ENABLE_LIVE_TRADING=false confirmed as the template default."

  # -------------------------------------------------------------------
  # SKELETON: deploy the built artifacts to staging.
  #
  # Staging (CLAUDE.md section 61) must run with ENABLE_LIVE_TRADING=false
  # -- all execution there is paper trading. Whatever secret/variable
  # mechanism the real deploy target uses (e.g. an ECS task definition's
  # environment, a Vercel project's env vars) must set that explicitly for
  # the staging environment; do not rely only on .env.example's default.
  # -------------------------------------------------------------------
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [build-and-test, assert-live-trading-disabled]
    # Off by default: no `DEPLOY_TO_STAGING_ENABLED` repo/environment
    # variable exists yet. Set it to "true" once real staging infra +
    # credentials exist, instead of editing this condition.
    if: vars.DEPLOY_TO_STAGING_ENABLED == 'true'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- apps/web -> Vercel (CLAUDE.md section 8) ---------------------
      # - name: Deploy web to Vercel (staging)
      #   run: npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --scope=<team> --env ENABLE_LIVE_TRADING=false
      #   working-directory: apps/web

      # --- backend services -> AWS ECS/Fargate (CLAUDE.md section 8) ----

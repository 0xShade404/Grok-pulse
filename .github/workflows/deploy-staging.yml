      #   run: |
      #     for svc in api market-scanner market-stream settlement; do
      #       aws ecs update-service --cluster grokpulse-staging --service $svc --force-new-deployment
      #     done

      - name: Placeholder
        run: echo "deploy-staging is a documented skeleton -- see the comment block at the top of this workflow file."

  # -------------------------------------------------------------------
  # SKELETON: smoke test the staging deployment.
  # -------------------------------------------------------------------
  smoke-tests-staging:
    name: Smoke test staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    # Redundant with deploy-staging's own gate (a skipped `needs` job
    # skips its dependents by default) -- kept explicit so this job's
    # intent reads correctly on its own.
    if: vars.DEPLOY_TO_STAGING_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # - name: Hit staging health endpoints
      #   run: |
      #     curl -sSf "${{ vars.STAGING_API_URL }}/health"
      #     curl -sSf "${{ vars.STAGING_API_URL }}/health/ready"

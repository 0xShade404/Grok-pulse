        run: echo "smoke-tests-staging is a documented skeleton -- see the comment block at the top of this workflow file."

  # -------------------------------------------------------------------
  # SKELETON: promote to production. This should require a human
  # approval gate (a GitHub Environment with required reviewers), not
  # fire automatically even once the above are real.
  # -------------------------------------------------------------------
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: smoke-tests-staging
    # Off by default, same as deploy-staging above. Flip once staging is
    # real AND a required-reviewers environment protection rule is
    # configured on the "production" GitHub Environment -- that reviewer
    # gate, not this condition, should be the real control once live.
    if: vars.DEPLOY_TO_PRODUCTION_ENABLED == 'true'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same shape as deploy-staging, targeting the production cluster/
      # project. Per CLAUDE.md sections 22/61/83/96: production must
      # require EXPLICIT, separate operator action to enable live trading
      # -- this deploy job enables the PAPER-trading production
      # application; it must never itself flip ENABLE_LIVE_TRADING to
      # true. See CLAUDE.md section 83 (“Live Trading Definition of
      # Done”) for the full checklist that must be satisfied first.

